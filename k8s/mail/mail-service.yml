apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-service
  labels:
    app: mail
spec:
  selector:
    matchLabels:
      app: mail
  template:
    metadata:
      labels:
        app: mail
    spec:
      containers:
        - name: mail
          image: kocichca152/mail:latest
          imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: Service
metadata:
  name: mail-service
  labels:
    app: mail
spec:
  type: NodePort
  ports:
    - port: 8085
      targetPort: 8085
      protocol: TCP
