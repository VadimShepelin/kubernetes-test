apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name  }}-mail-deploy
  labels:
    app: {{ .Release.Name  }}-mail
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name  }}-mail
  template:
    metadata:
      labels:
        app: {{ .Release.Name  }}-mail
    spec:
      containers:
        - name: mail
          ports:
            - containerPort: 8085
          image: kocichca152/mail:latest
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name  }}-mail-service
  labels:
    app: {{ .Release.Name  }}-mail-service
spec:
  selector:
    app: {{ .Release.Name  }}-mail
  type: NodePort
  ports:
    - port: 8085
      targetPort: 8085
      protocol: TCP
